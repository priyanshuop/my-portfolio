<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Priyanshu | Profile</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: white;
    }

    .profile-card {
      width: 90%;
      max-width: 450px;
      padding: 35px;
      text-align: center;
      background: #1e293b;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    .avatar {
      width: 100px;
      height: 100px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #38bdf8;
      color: #0f172a;
      font-size: 40px;
      font-weight: bold;
    }

    h1 {
      margin-top: 20px;
      font-size: 30px;
    }

    .bio {
      margin: 10px 0 25px;
      color: #94a3b8;
    }

    .info {
      text-align: left;
      margin-top: 20px;
    }

    .info p {
      margin: 12px 0;
      padding: 12px;
      background: #0f172a;
      border-radius: 10px;
    }

    .skills {
      margin-top: 25px;
    }

    .skills h2 {
      margin-bottom: 15px;
    }

    .skill {
      display: inline-block;
      padding: 8px 14px;
      margin: 5px;
      border-radius: 20px;
      background: #334155;
      color: #7dd3fc;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 25px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>

<body>

  <div class="profile-card">

    <div class="avatar">P</div>

    <h1>Priyanshu</h1>
    <p class="bio">Coder • Developer • Tech Enthusiast</p>

    <div class="info">
      <p>
        📱 Telegram:
        <a href="https://t.me/gunnuio" target="_blank">
          @gunnuio
        </a>
      </p>

      <p>
        📧 Email:
        <a href="mailto:priyanshu345@yahoo.com">
          priyanshu345@yahoo.com
        </a>
      </p>
    </div>

    <div class="skills">
      <h2>Skills</h2>

      <span class="skill">💻 Coder</span>
      <span class="skill">🌐 Web Development</span>
      <span class="skill">🐍 Python</span>
      <span class="skill">⚡ JavaScript</span>
      <span class="skill">🛠️ Problem Solving</span>
      <span class="skill">🚀 Tech Enthusiast</span>
    </div>

    <div class="footer">
      © 2026 Priyanshu
    </div>

  </div>

</body>
</html>
